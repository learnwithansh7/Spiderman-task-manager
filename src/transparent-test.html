<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SpiderReminder R0 - Transparent Overlay Test</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
      background-color: transparent !important;
      user-select: none;
    }
    .red-box {
      position: absolute;
      top: 40px;
      left: 40px;
      background-color: rgba(220, 38, 38, 0.92);
      color: #ffffff;
      padding: 16px 24px;
      border-radius: 10px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      font-weight: bold;
      border: 2px solid #ffffff;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }
    .red-box .subtext {
      font-size: 12px;
      font-weight: normal;
      margin-top: 6px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="red-box">
    <div>✔ [R0 Test 2] Transparent Overlay Window Active</div>
    <div class="subtext">This window is transparent, frameless, and always-on-top.</div>
  </div>
</body>
</html>
